<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post-Cronos: Córdoba 2060</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a1a2e}
header{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;padding:40px 20px;text-align:center}
header h1{font-size:2.5rem;font-weight:800;letter-spacing:-1px}
header p{font-size:1.1rem;opacity:.8;margin-top:8px}
.filters{display:flex;gap:12px;justify-content:center;padding:24px 20px;flex-wrap:wrap;background:#fff;border-bottom:1px solid #e0e0e0;position:sticky;top:0;z-index:10}
.filters select,.filters input{padding:10px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:.9rem;font-family:inherit;background:#fff;min-width:160px;cursor:pointer;transition:border-color .2s}
.filters select:focus,.filters input:focus{outline:none;border-color:#302b63}
.stats{display:flex;gap:16px;justify-content:center;padding:20px;flex-wrap:wrap}
.stat-card{background:#fff;border-radius:14px;padding:16px 28px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);min-width:120px}
.stat-card h3{font-size:1.8rem;font-weight:700;color:#302b63}
.stat-card p{font-size:.8rem;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding:20px;max-width:1400px;margin:0 auto}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,.1)}
.card-img{width:100%;height:240px;object-fit:cover;background:#f5f5f5;display:block}
.card-body{padding:18px}
.card-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px}
.card-name{font-size:1.15rem;font-weight:700;color:#1a1a2e}
.card-badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:500}
.badge-eje{background:#e8e0ff;color:#302b63}
.badge-genero{background:#ffe0e6;color:#c2185b}
.badge-genero.masc{background:#dbeafe;color:#1e40af}
.badge-edad{background:#e0f7e6;color:#2e7d32}
.badge-lugar{background:#fff3e0;color:#e65100}
.badge-colegio{background:#f3e5f5;color:#7b1fa2}
.card-desc{font-size:.85rem;color:#555;line-height:1.5;margin:8px 0}
.card-desc strong{color:#1a1a2e}
.card-interp{font-size:.82rem;color:#444;line-height:1.5;background:#f8f9ff;border-radius:8px;padding:10px;margin-top:8px;border-left:3px solid #302b63}
footer{text-align:center;padding:30px;color:#888;font-size:.85rem}
.no-results{text-align:center;padding:60px 20px;color:#888;font-size:1.1rem;grid-column:1/-1}
@media(max-width:600px){.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1>Post-Cronos</h1>
  <p>Córdoba del año 2060 · Visualizaciones de niños y adolescentes</p>
</header>

<div class="filters">
  <select id="filterEje">
    <option value="all">Todos los ejes</option>
  </select>
  <select id="filterGenero">
    <option value="all">Todos los géneros</option>
    <option value="Femenino">Femenino</option>
    <option value="Masculino">Masculino</option>
  </select>
  <input type="text" id="filterSearch" placeholder="Buscar participante...">
</div>

<div class="stats" id="stats"></div>

<div class="gallery" id="gallery"></div>

<footer>Proyecto Post-Cronos · Córdoba, Argentina · 2026</footer>

<script>
const DATA = [
  {id:"enc_007",nombre:"Nina French",edad:13,genero:"Femenino",lugar:"Córdoba Capital",colegio:"Escuela Rosarito",eje:"Mobiliario",img:"https://storage.googleapis.com/post-cronos-dibujos-2060/dibujo_nuevo_001.jpeg",interp:"Edificio fértil de 5 pisos con columna central de tierra permitiendo un jardín colgante vertical.",diseno:"Edificio-columna vivo: mobiliario urbano vertical donde una columna central de tierra fértil conecta cada piso, integrando naturaleza y arquitectura."},
  {id:"enc_001",nombre:"Maria Garcia",edad:14,genero:"Femenino",lugar:"Cordoba Capital",colegio:"",eje:"",img:"https://storage.googleapis.com/post-cronos-dibujos-2060/maria_garcia_001.png",interp:"Árbol que genera energía en Plaza San Martín, con hojas como paneles solares.",diseno:"Parque con estaciones de carga solar comunitarias, con bancos con puertos USB."},
  {id:"enc_002",nombre:"Lucas Perez",edad:16,genero:"Masculino",lugar:"Villa Maria",colegio:"",eje:"",img:"https://storage.googleapis.com/post-cronos-dibujos-2060/lucas_perez_002.png",interp:"Autobús autónomo que recorre barrios y adapta su ruta según quién sube.",diseno:"Microbuses itinerantes que transforman el transporte público en espacios multifunción."},
  {id:"enc_003",nombre:"Sofia Torres",edad:13,genero:"Femenino",lugar:"Jesus Maria",colegio:"",eje:"",img:"https://storage.googleapis.com/post-cronos-dibujos-2060/sofia_torres_003.png",interp:"Espejo inteligente en plazas que refleja cómo se vería la ciudad según nuestras acciones.",diseno:"Kioscos de realidad aumentada mostrando simulaciones del futuro basadas en decisiones presentes."},
  {id:"enc_004",nombre:"Agustina Ruiz",edad:15,genero:"Femenino",lugar:"Córdoba Capital",colegio:"",eje:"",img:"https://storage.googleapis.com/post-cronos-dibujos-2060/agustina_ruiz_004.png",interp:"Huerto vertical inteligente en paredes escolares con luz reciclada y compostaje.",diseno:"Paredes comestibles escolares: huertos verticales con sensores de cuidado ambiental."},
  {id:"enc_005",nombre:"Tomás Herrera",edad:17,genero:"Masculino",lugar:"La Calera",colegio:"",eje:"",img:"https://storage.googleapis.com/post-cronos-dibujos-2060/tomas_herrera_005.png",interp:"Red de préstamo de objetos entre vecinos mediante lockers inteligentes.",diseno:"Red de trueque automatizada con lockers inteligentes y economía circular."},
  {id:"enc_006",nombre:"Valentina Castro",edad:14,genero:"Femenino",lugar:"Unquillo",colegio:"",eje:"",img:"https://storage.googleapis.com/post-cronos-dibujos-2060/valentina_castro_006.png",interp:"Banco de historias familiares en la plaza con proyecciones animadas.",diseno:"Archivos vivos comunitarios: proyecciones interactivas de memorias barriales."},
  {id:"uuid_1",nombre:"Luna",edad:10,genero:"Femenino",lugar:"Córdoba",colegio:"",eje:"",img:"",interp:"",diseno:""},
  {id:"uuid_2",nombre:"Tomás",edad:9,genero:"Masculino",lugar:"Córdoba",colegio:"",eje:"",img:"",interp:"",diseno:""},
  {id:"uuid_3",nombre:"Zoe Salgado",edad:8,genero:"Femenino",lugar:"Córdoba",colegio:"",eje:"",img:"",interp:"",diseno:""},
  {id:"enc_test",nombre:"Thiago Gomez",edad:11,genero:"Masculino",lugar:"Córdoba Capital",colegio:"",eje:"",img:"https://storage.googleapis.com/post-cronos-dibujos-2060/test_nino_demo.png",interp:"",diseno:""}
];

// Extract unique ejes
const ejes = [...new Set(DATA.map(d=>d.eje).filter(Boolean))];
const filterEje = document.getElementById('filterEje');
ejes.forEach(e=>{const o=document.createElement('option');o.value=e;o.textContent=e;filterEje.appendChild(o)});

function render(){
  const eje=document.getElementById('filterEje').value;
  const genero=document.getElementById('filterGenero').value;
  const q=document.getElementById('filterSearch').value.toLowerCase();
  const filtered=DATA.filter(d=>(eje==='all'||d.eje===eje)&&(genero==='all'||d.genero===genero)&&(!q||d.nombre.toLowerCase().includes(q)));
  // Stats
  const total=filtered.length;
  const conDibujo=filtered.filter(d=>d.img).length;
  const ejesUnicos=[...new Set(filtered.map(d=>d.eje).filter(Boolean))].length;
  document.getElementById('stats').innerHTML=`
    <div class="stat-card"><h3>${total}</h3><p>Participantes</p></div>
    <div class="stat-card"><h3>${conDibujo}</h3><p>Con dibujo</p></div>
    <div class="stat-card"><h3>${ejesUnicos}</h3><p>Ejes temáticos</p></div>
  `;
  // Gallery
  const g=document.getElementById('gallery');
  if(!filtered.length){g.innerHTML='<div class="no-results">Sin resultados</div>';return}
  g.innerHTML=filtered.map(d=>`
    <div class="card">
      ${d.img?`<img class="card-img" src="${d.img}" alt="${d.nombre}" loading="lazy">`:`<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#bbb;font-size:3rem">🎨</div>`}
      <div class="card-body">
        <div class="card-header">
          <div class="card-name">${d.nombre}</div>
        </div>
        <div class="card-badges">
          ${d.eje?`<span class="badge badge-eje">${d.eje}</span>`:''}
          <span class="badge badge-genero${d.genero==='Masculino'?' masc':''}">${d.genero}</span>
          <span class="badge badge-edad">${d.edad} años</span>
          <span class="badge badge-lugar">${d.lugar}</span>
          ${d.colegio?`<span class="badge badge-colegio">${d.colegio}</span>`:''}
        </div>
        ${d.interp?`<div class="card-desc"><strong>Interpretación:</strong> ${d.interp}</div>`:''}
        ${d.diseno?`<div class="card-interp"><strong>Diseño final:</strong> ${d.diseno}</div>`:''}
      </div>
    </div>
  `).join('');
}

document.getElementById('filterEje').addEventListener('change',render);
document.getElementById('filterGenero').addEventListener('change',render);
document.getElementById('filterSearch').addEventListener('input',render);
render();
</script>
</body>
</html>
